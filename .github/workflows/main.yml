name: Deploy Backend 1 "INRFS BE"

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}        # e.g. 187.52.115.32
          username: ${{ secrets.VPS_USER }}    # e.g. root
          key: ${{ secrets.VPS_SSH_KEY }}      # private key stored in GitHub Secrets
          port: 22
          script: |
            cd /var/www/INRFS_BACKEND
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart inrfs
